<body class="bg-background font-body text-on-background selection:bg-primary-fixed selection:text-on-primary-fixed">
  <header class="w-full absolute top-0 flex justify-center items-center py-6 px-8 z-50">
    <nav class="flex items-center justify-between w-full max-w-7xl">
      <div class="text-2xl font-bold tracking-tight text-emerald-800 dark:text-emerald-400 font-headline"><a class="urls" href="">NutreT</a></div>
      <div class="flex items-center gap-2 text-emerald-900 dark:text-emerald-50">
        <span class="material-symbols-outlined" data-icon="leafy_green">energy_savings_leaf</span>
      </div>
    </nav>
  </header>
  <main class="principal min-h-screen flex items-center justify-center bg-login-hero px-6 pt-24 pb-12"
    data-alt="minimalist modern kitchen with clean white marble countertops, fresh organic green vegetables in a basket, and soft morning sunlight">
    <div
      class="w-full max-w-md bg-white/80 backdrop-blur-xl rounded-xl p-8 md:p-12 shadow-[0_-4px_24px_0_rgba(25,28,27,0.04)] border border-outline-variant/15 flex flex-col gap-8">
      <div class="text-center space-y-2">
        <h1 class="font-headline text-3xl font-extrabold text-on-background tracking-tight">Bienvenido de nuevo</h1>
        <p class="text-on-surface-variant font-medium">Cuida tu cuerpo, empieza el día con NutreT.</p>
      </div>
      <form class="flex flex-col gap-6" onsubmit="sendData(event)">
        <div class="space-y-2">
          <label class="block text-sm font-semibold text-on-surface ml-1 font-label" for="user">Nombre de usuario</label>
          <div class="relative">
            <input
              class="input w-full px-5 py-4 bg-surface-container rounded-lg border-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/60"
              id="user" placeholder="nombre_usuario" type="text" />
          </div>
        </div>
        <div class="space-y-2">
          <div class="flex justify-between items-center px-1">
            <label class="block text-sm font-semibold text-on-surface font-label" for="passwd">Contraseña</label>
          </div>
          <div class="relative">
            <input
              class="input w-full px-5 py-4 bg-surface-container rounded-lg border-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline/60"
              id="passwd" placeholder="••••••••" type="password" />
          </div>
        </div>
        <div class="flex items-center gap-3 px-1">
          <input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary-fixed cursor-pointer"
            id="recordar" type="checkbox" />
          <label class="text-sm font-medium text-on-surface-variant cursor-pointer" for="recordar">Recordar mi
            sesión</label>
        </div>
        <div class="pt-2">
          <button
            class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold rounded-xl shadow-lg shadow-primary/10 hover:opacity-90 active:scale-[0.98] transition-all duration-200"
            type="submit">
            Iniciar Sesión
          </button>
        </div>
        <p class="hidden text-sm text-error font-semibold text-center bg-error-container/30 py-2 rounded-lg border border-error/10"
          id="error">
          Nombre de usuario o contraseña incorrectos. Por favor, inténtalo de nuevo.
        </p>
      </form>
