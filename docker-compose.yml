version: '3.8'

services:
  php:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      OPENAI_KEY: ${OPENAI_KEY}
      APP_URL: ${APP_URL}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./app:/var/www/html/app
      - ./public:/var/www/html/public
      - recipes_storage:/var/www/html/storage/recipes
      - ./storage:/var/www/html/storage
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  recipes_storage:
